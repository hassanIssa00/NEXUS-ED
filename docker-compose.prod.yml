services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER before starting production services}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting production services}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME before starting production services}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - million_network

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting production services}
    volumes:
      - redis_data:/data
    networks:
      - million_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before starting production services}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting production services}
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting production services}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET before starting production services}
      FRONTEND_URL: https://${DOMAIN_NAME:?Set DOMAIN_NAME before starting production services}
    networks:
      - million_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:?Set DOMAIN_NAME before starting production services}/api
      API_INTERNAL_URL: http://api:4000
    networks:
      - million_network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web
      - api
    networks:
      - million_network

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  million_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
