name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-only
          POSTGRES_DB: nexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm to the lockfile generator version
        run: npm install --global npm@11.6.2

      - name: Setup Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"
          DIRECT_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"

      - name: Apply migrations to ephemeral PostgreSQL
        run: npm run db:migrate --workspace=api
        env:
          DATABASE_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"
          DIRECT_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"

      - name: Seed the real school record only
        run: npm run db:seed --workspace=api
        env:
          DATABASE_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"
          DIRECT_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"
          PUBLIC_SCHOOL_SLUG: "al-ikhlas-jeddah"
          NEXUS_SCHOOL_NAME: "مدارس الإخلاص الأهلية بجدة"

      - name: Verify seed is idempotent and creates no demo users
        run: |
          npm run db:seed --workspace=api
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const schools = await prisma.school.count({ where: { slug: 'al-ikhlas-jeddah', isActive: true } });
            const users = await prisma.user.count();
            if (schools !== 1 || users !== 0) throw new Error(`Unexpected seed result: schools=${schools}, users=${users}`);
            console.log('Seed is repeatable; only the real school record exists.');
          })().catch((error) => { console.error(error); process.exitCode = 1; }).finally(() => prisma.$disconnect());
          NODE
        env:
          DATABASE_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"
          DIRECT_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"
          PUBLIC_SCHOOL_SLUG: "al-ikhlas-jeddah"
          NEXUS_SCHOOL_NAME: "مدارس الإخلاص الأهلية بجدة"

      - name: Type Check
        run: npm run check-types

      - name: Validate Expo SDK dependencies
        run: npx expo-doctor
        working-directory: apps/mobile

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/nexus-android-check"
        working-directory: apps/mobile

      - name: Test Firestore security rules
        run: npx --yes firebase-tools@15.26.0 emulators:exec --project demo-nexus-rules --only firestore "npm run test:security --workspace=web"

      - name: Run Tests
        run: cd apps/api && npm run test:cov

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build API
        run: npm run build --workspace=api

      - name: Smoke test API against PostgreSQL
        shell: bash
        env:
          NODE_ENV: production
          PORT: 4000
          DATABASE_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"
          DIRECT_URL: "postgresql://nexus:nexus-ci-only@localhost:5432/nexus_ci"
          JWT_SECRET: "ci-only-jwt-secret-2026-not-prod-01"
          JWT_REFRESH_SECRET: "ci-only-jwt-refresh-secret-2026-prod"
          FRONTEND_URL: "https://nexus.masarplatform.org"
          GOOGLE_CLIENT_ID: "000000000000-ci.apps.googleusercontent.com"
          SMTP_HOST: "127.0.0.1"
          SMTP_PORT: "2525"
          SMTP_USER: "ci@nexus.test"
          SMTP_PASS: "ci-only-not-a-real-password"
          SMTP_FROM_EMAIL: "ci@nexus.test"
          PUBLIC_SCHOOL_SLUG: "al-ikhlas-jeddah"
        run: |
          node apps/api/scripts/test-smtp-server.mjs > /tmp/nexus-smtp.log 2>&1 &
          smtp_pid=$!
          node apps/api/dist/src/main.js > /tmp/nexus-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "$smtp_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/api/health/live >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:4000/api/health/live >/dev/null; then
            cat /tmp/nexus-api.log
            exit 1
          fi
          sleep 12
          readiness="$(curl --fail --silent http://127.0.0.1:4000/api/health/ready)"
          printf '%s' "$readiness" | jq --exit-status '.status == "ready"'
          if ! node apps/api/scripts/auth-smoke.mjs; then
            cat /tmp/nexus-api.log
            exit 1
          fi

      - name: Build production API containers
        run: |
          docker build --file apps/api/Dockerfile --target runtime --tag nexus-api:ci .
          docker build --file apps/api/Dockerfile --target migrator --tag nexus-api-migrator:ci .
          docker build --file apps/web/Dockerfile --tag nexus-web:ci .

      - name: Validate free self-hosted production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Build Web
        run: npm run build --workspace=web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_ENABLE_DEMO_AUTH: false

      - name: Smoke test production CSP nonce
        shell: bash
        env:
          PORT: 3010
          NEXT_PUBLIC_API_URL: https://api.example.invalid/api
        run: |
          npm run start --workspace=web > /tmp/nexus-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010/ar/login >/dev/null; then
              break
            fi
            sleep 2
          done
          node --input-type=module <<'NODE'
          const first = await fetch('http://127.0.0.1:3010/ar/login');
          if (!first.ok) throw new Error(`login returned ${first.status}`);
          const policy = first.headers.get('content-security-policy') ?? '';
          const nonce = policy.match(/'nonce-([^']+)'/)?.[1];
          const body = await first.text();
          if (!nonce || !body.includes(`nonce="${nonce}"`)) {
            throw new Error('CSP nonce is missing or not attached to rendered scripts');
          }
          const second = await fetch('http://127.0.0.1:3010/ar/login');
          const nextNonce = (second.headers.get('content-security-policy') ?? '').match(/'nonce-([^']+)'/)?.[1];
          if (!nextNonce || nextNonce === nonce) {
            throw new Error('CSP nonce was not rotated for the next request');
          }
          console.log('Production login CSP and per-request nonce passed.');
          NODE

      - name: Lint Web
        if: ${{ !cancelled() }}
        run: npm run lint --workspace=web

      - name: Lint API
        if: ${{ !cancelled() }}
        run: npm run lint --workspace=api

  deploy-oci:
    name: Deploy to OCI Always Free (opt-in)
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.OCI_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Configure verified SSH access
        shell: bash
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in OCI_SSH_PRIVATE_KEY OCI_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/nexus_deploy_key"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/nexus_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" >/dev/null

      - name: Deploy and wait for API readiness
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
        run: |
          set -euo pipefail
          for name in OCI_HOST OCI_USER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          ssh \
            -i "$HOME/.ssh/nexus_deploy_key" \
            -p "${OCI_SSH_PORT:-22}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$OCI_USER@$OCI_HOST" 'bash -s' < scripts/deploy-oci-free.sh
