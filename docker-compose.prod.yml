services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PUBLIC_SCHOOL_SLUG: ${PUBLIC_SCHOOL_SLUG:-al-ikhlas-jeddah}
      NEXUS_SCHOOL_NAME: ${NEXUS_SCHOOL_NAME:-مدارس الإخلاص الأهلية بجدة}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
    command:
      - sh
      - -c
      - npm run db:migrate --workspace=api && npm run db:seed --workspace=api
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  livekit:
    image: ${LIVEKIT_SERVER_IMAGE:-livekit/livekit-server:v1.13.10}
    restart: unless-stopped
    command:
      - --config
      - /etc/livekit.yaml
      - --keys
      - ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env.production}:${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env.production}
      - --node-ip
      - ${LIVEKIT_NODE_IP:?Set LIVEKIT_NODE_IP to this server's public IPv4 address}
      - --bind
      - 0.0.0.0
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7881:7881/tcp"
      - "50000-51000:50000-51000/udp"
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  livekit-egress:
    image: ${LIVEKIT_EGRESS_IMAGE:-livekit/egress:latest}
    restart: unless-stopped
    shm_size: 1gb
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env.production}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env.production}
      LIVEKIT_WS_URL: ws://livekit:7880
    volumes:
      - ./livekit-egress.yaml:/etc/egress.yaml:ro
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      FRONTEND_URL: https://${DOMAIN_NAME:?Set DOMAIN_NAME in .env.production}
      PUBLIC_SCHOOL_SLUG: ${PUBLIC_SCHOOL_SLUG:-al-ikhlas-jeddah}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.production}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in .env.production}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env.production}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env.production}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL in .env.production}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Nexus EDU}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://meetings.${DOMAIN_NAME:?Set DOMAIN_NAME in .env.production}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env.production}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env.production}
      LIVEKIT_RECORDING_S3_ENDPOINT: ${LIVEKIT_RECORDING_S3_ENDPOINT:-}
      LIVEKIT_RECORDING_S3_ACCESS_KEY: ${LIVEKIT_RECORDING_S3_ACCESS_KEY:-}
      LIVEKIT_RECORDING_S3_SECRET: ${LIVEKIT_RECORDING_S3_SECRET:-}
      LIVEKIT_RECORDING_S3_REGION: ${LIVEKIT_RECORDING_S3_REGION:-ap-southeast-1}
      LIVEKIT_RECORDING_S3_BUCKET: ${LIVEKIT_RECORDING_S3_BUCKET:-assignments}
    depends_on:
      migrate:
        condition: service_completed_successfully
      livekit:
        condition: service_started
      livekit-egress:
        condition: service_started
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:?Set NEXT_PUBLIC_LIVEKIT_URL in .env.production}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_started
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - private
    security_opt:
      - no-new-privileges:true

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
