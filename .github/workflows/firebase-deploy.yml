name: Validate Firebase safeguards

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Firebase targets and rule parity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const expectedProject = 'nexus-edu-ikhlas-jeddah-2026';
          for (const file of ['.firebaserc', 'firebase/.firebaserc']) {
            const config = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (config.projects?.default !== expectedProject) {
              throw new Error(`${file} must target ${expectedProject}`);
            }
          }
          const primaryFirestoreRules = fs.readFileSync('firestore.rules', 'utf8').trim();
          const firebaseFirestoreRules = fs.readFileSync('firebase/firestore.rules', 'utf8').trim();
          if (primaryFirestoreRules !== firebaseFirestoreRules) {
            throw new Error('Root and Firebase Firestore rules must be identical');
          }
          if (!primaryFirestoreRules.includes('match /{document=**}')) {
            throw new Error('Firestore rules must include a deny-by-default catch-all');
          }
          for (const file of ['storage.rules', 'firebase/storage.rules']) {
            const rules = fs.readFileSync(file, 'utf8');
            if (!/allow read, write: if false;/.test(rules)) {
              throw new Error(`${file} must remain deny-all until Storage authorization is implemented`);
            }
          }
          console.log('Firebase targets, Firestore rule parity, and closed Storage rules verified.');
          NODE

      - name: Verify Cloud Functions cannot be deployed on Spark
        run: |
          if npm run deploy --prefix firebase/functions; then
            echo 'Unexpectedly allowed a paid-plan Firebase Functions deployment.'
            exit 1
          fi
